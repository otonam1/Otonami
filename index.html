<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>otonami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* Vice City: розовый + фиолетовый градиент */
    --bg:          #12071a;
    --bg-2:        #1a0b26;
    --bg-3:        #0d0412;
    --fg:          #f0a8d8;   /* розовый неон */
    --fg-bright:   #ffd6f0;
    --fg-soft:     #c084fc;   /* фиолетовый — вторая часть лого */
    --fg-dim:      #8a5c8a;
    --fg-mid:      #b880b8;
    --pink:        #ff5fa2;
    --purple:      #c084fc;   /* светлый фиолетовый */
    --purple-deep: #7c3aed;   /* глубокий фиолетовый */
    --purple-soft: #a855f7;
    --violet:      #d8b4fe;   /* лавандовый */
    --line:        #2a1440;
    --line-bright: #3d1f5c;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(240,168,216,0.01) 0px, rgba(240,168,216,0.01) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 9999;
  }

  /* закатный градиент + фиолетовое свечение */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(255,95,162,0.15) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 30%, rgba(192,132,252,0.08) 0%, transparent 60%),
      linear-gradient(180deg, transparent 0%, rgba(124,58,237,0.06) 50%, rgba(255,95,162,0.06) 100%);
    pointer-events: none;
    z-index: 0;
  }

  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ─── верхний статус-бар ─── */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-dim);
    border-bottom: 1px solid var(--line);
    background: rgba(18,7,26,0.85);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  .topbar .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 10px var(--pink);
    margin-right: 8px;
    vertical-align: middle;
    animation: dotPulse 2.4s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--pink); }
    50%      { opacity: 0.5; box-shadow: 0 0 3px var(--pink); }
  }
  .topbar-left, .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar .sep { color: var(--line-bright); }

  /* ─── центр ─── */
  .hero {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    padding: 40px 24px;
    pointer-events: none;
  }

  .hero-meta {
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--fg-mid);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 0.2s;
  }
  .hero-meta .br {
    color: var(--line-bright);
    margin: 0 8px;
  }
  .hero-meta .tag-pink { color: var(--pink); }
  .hero-meta .tag-purple { color: var(--purple); }

  /* ─── ЛОГО ─── */
  .hero-title {
    font-size: clamp(48px, 12vw, 140px);
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 0.95;
    color: var(--fg-bright);
    text-align: center;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeIn 1s ease forwards 0.4s;
    position: relative;
    text-shadow:
      0 0 20px rgba(255,95,162,0.5),
      0 0 40px rgba(255,95,162,0.25),
      0 0 80px rgba(168,85,247,0.15);
  }
  /* nami — фиолетовый ГРАДИЕНТ + свечение */
  .hero-title .accent {
    font-weight: 400;
    background: linear-gradient(135deg, var(--violet) 0%, var(--purple) 40%, var(--purple-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    /* свечение через filter, т.к. text-shadow не работает с прозрачным текстом */
    filter: drop-shadow(0 0 12px rgba(192,132,252,0.55))
            drop-shadow(0 0 24px rgba(124,58,237,0.35));
  }

  .hero-title::after {
    content: '_';
    color: var(--pink);
    font-weight: 300;
    animation: cursorBlink 1.1s step-end infinite;
    margin-left: 4px;
    text-shadow: 0 0 12px var(--pink), 0 0 24px rgba(255,95,162,0.6);
  }
  @keyframes cursorBlink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  .hero-sub {
    font-size: clamp(10px, 1.2vw, 13px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--fg);
    text-align: center;
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeIn 1s ease forwards 0.7s;
    max-width: 90vw;
    line-height: 1.8;
  }
  .hero-sub .dim { color: var(--fg-dim); }
  .hero-sub .tag-purple { color: var(--purple); }

  /* ─── кнопка — неоновая с фиолетовым градиентом ─── */
  .listen-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 18px 42px;
    background: transparent;
    border: 1px solid var(--pink);
    color: var(--fg-bright);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    pointer-events: auto;
    overflow: hidden;
    box-shadow: 0 0 12px rgba(255,95,162,0.35), inset 0 0 12px rgba(255,95,162,0.08);
    transition: color 0.25s, box-shadow 0.25s;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1s;
  }
  .listen-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--pink) 0%, var(--purple-soft) 50%, var(--purple-deep) 100%);
    transform: translateX(-101%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: -1;
  }
  .listen-btn:hover {
    color: #12071a;
    border-color: var(--purple);
    box-shadow:
      0 0 24px rgba(192,132,252,0.7),
      0 0 48px rgba(124,58,237,0.4),
      inset 0 0 16px rgba(255,255,255,0.15);
  }
  .listen-btn:hover::before { transform: translateX(0); }
  .listen-btn .arrow {
    display: inline-block;
    transition: transform 0.25s;
    font-size: 16px;
  }
  .listen-btn:hover .arrow { transform: translateX(6px); }

  /* ─── подсказка снизу ─── */
  .hero-footer {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fg-dim);
    z-index: 5;
    display: flex;
    gap: 20px;
    align-items: center;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1.3s;
    pointer-events: none;
  }
  .hero-footer .sep { color: var(--line-bright); }
  .hero-footer .tag-purple { color: var(--purple); }

  /* угловые маркеры — розовые слева, фиолетовые справа */
  .corner {
    position: fixed;
    width: 20px; height: 20px;
    border-color: var(--pink);
    border-style: solid;
    border-width: 0;
    z-index: 3;
    pointer-events: none;
    filter: drop-shadow(0 0 4px rgba(255,95,162,0.5));
  }
  .corner.tl { top: 46px; left: 18px;  border-top-width: 1px;    border-left-width: 1px;  }
  .corner.tr { top: 46px; right: 18px; border-top-width: 1px;    border-right-width: 1px; }
  .corner.bl { bottom: 46px; left: 18px;  border-bottom-width: 1px; border-left-width: 1px;  }
  .corner.br { bottom: 46px; right: 18px; border-bottom-width: 1px; border-right-width: 1px; }
  .corner.tr, .corner.br {
    border-image: linear-gradient(135deg, var(--violet), var(--purple-deep)) 1;
    border-color: var(--purple);
    filter: drop-shadow(0 0 4px rgba(192,132,252,0.5));
  }

  /* разделитель — розовый → фиолетовый градиент */
  .hero-divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, var(--pink), var(--purple-soft) 50%, var(--purple-deep));
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeIn 1s ease forwards 0.8s;
    position: relative;
    box-shadow: 0 0 8px rgba(192,132,252,0.4);
  }
  .hero-divider::before,
  .hero-divider::after {
    content: '';
    position: absolute;
    top: -3px;
    width: 7px; height: 7px;
    border-radius: 50%;
  }
  .hero-divider::before {
    left: -3px;
    background: var(--pink);
    box-shadow: 0 0 8px var(--pink), 0 0 16px rgba(255,95,162,0.6);
  }
  .hero-divider::after {
    right: -3px;
    background: var(--purple-soft);
    box-shadow: 0 0 8px var(--purple-soft), 0 0 16px rgba(168,85,247,0.6);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .hero-title { font-size: clamp(40px, 16vw, 80px); }
    .hero-meta { letter-spacing: 0.25em; font-size: 9px; }
    .hero-sub { letter-spacing: 0.2em; font-size: 10px; }
    .listen-btn { padding: 16px 30px; font-size: 12px; letter-spacing: 0.2em; }
    .hero-footer { font-size: 9px; gap: 12px; letter-spacing: 0.15em; }
    .corner { display: none; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="topbar">
  <div class="topbar-left">
    <span><span class="dot"></span>otonami</span>
    <span class="sep">/</span>
    <span>Otonami VI updates (pre-release)</span>
  </div>
  <div class="topbar-right">
    <span id="clock">00:00:00</span>
  </div>
</div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="hero">
  <div class="hero-meta">
    <span class="tag-pink">локальный плеер</span><span class="br">/</span><span class="tag-purple">без облака</span><span class="br">/</span>без регистрации
  </div>

  <h1 class="hero-title">oto<span class="accent">nami</span></h1>

  <div class="hero-divider"></div>

  <div class="hero-sub">
    音波 · <span class="dim">звуковая волна</span><br>
    плейлисты · визуализация · <span class="tag-purple">умный шаффл</span>
  </div>

  <a href="player.html" class="listen-btn">
    слушать
    <span class="arrow">→</span>
  </a>
</div>

<div class="hero-footer">
  <span>omarchy · edition</span>
  <span class="sep">/</span>
  <span class="tag-purple">local-first</span>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   ЧАСЫ
   ═══════════════════════════════════════════════════════ */
const clockEl = document.getElementById('clock');
function updateClock() {
  const d = new Date();
  clockEl.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, '0')).join(':');
}
updateClock();
setInterval(updateClock, 1000);

/* ═══════════════════════════════════════════════════════
   ФОНОВАЯ ВОЛНА — розовый верх + фиолетовый градиент низ
   ═══════════════════════════════════════════════════════ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const COLORS = {
  primary: '#ffd6f0',      // светлый розовый — верхняя волна
  accentTop: '#c084fc',    // светлый фиолетовый — верх нижней волны
  accentBottom: '#7c3aed', // глубокий фиолетовый — низ нижней волны
  glowPink: '#ff5fa2',
  glowPurple: '#a855f7'
};

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  return [
    parseInt(hex.slice(0, 2), 16),
    parseInt(hex.slice(2, 4), 16),
    parseInt(hex.slice(4, 6), 16)
  ];
}
function rgbaStr(hex, alpha) {
  const [r, g, b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

function resize() {
  const scale = window.devicePixelRatio > 1 ? 2 : 1.5;
  canvas.width  = Math.floor(window.innerWidth / scale);
  canvas.height = Math.floor(window.innerHeight / scale);
  canvas.style.width  = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

let phase = 0;
const N = 180;
let wave = new Float32Array(N);

function draw() {
  requestAnimationFrame(draw);

  const W = canvas.width;
  const H = canvas.height;
  const cx = Math.floor(W / 2);
  const cy = Math.floor(H / 2);

  /* фон */
  ctx.fillStyle = '#12071a';
  ctx.fillRect(0, 0, W, H);

  /* закатный градиент снизу */
  const sunset = ctx.createLinearGradient(0, H, 0, H * 0.6);
  sunset.addColorStop(0, 'rgba(255,95,162,0.08)');
  sunset.addColorStop(0.5, 'rgba(124,58,237,0.05)');
  sunset.addColorStop(1, 'transparent');
  ctx.fillStyle = sunset;
  ctx.fillRect(0, H * 0.6, W, H * 0.4);

  /* направляющая */
  ctx.fillStyle = '#2a1440';
  for (let x = 0; x < W; x += 6) {
    ctx.fillRect(x, cy, 3, 1);
  }

  phase += 0.012;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const s1 = Math.sin(t * 22 + phase * 1.0) * 0.5;
    const s2 = Math.sin(t * 41 - phase * 1.3) * 0.25;
    const s3 = Math.sin(t * 7  + phase * 0.6) * 0.4;
    const s4 = Math.sin(t * 63 + phase * 2.0) * 0.12;
    wave[i] = s1 + s2 + s3 + s4;
  }

  const amplitude = 28;
  const width = Math.min(W * 0.7, 340);
  const halfW = Math.floor(width / 2);
  const PX = 2;

  /* верхняя волна — розовый неон */
  ctx.shadowBlur = 8;
  ctx.shadowColor = COLORS.glowPink;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const edge = Math.sin(t * Math.PI);
    const yOff = Math.round(wave[i] * amplitude * edge);
    const x = Math.floor(cx - halfW + t * width);
    const y = cy - Math.abs(yOff);
    const dist = Math.abs(yOff);
    for (let py = 0; py < dist; py += PX) {
      const alpha = 1 - py / (amplitude + 1);
      ctx.fillStyle = rgbaStr(COLORS.primary, 0.15 + alpha * 0.85);
      ctx.fillRect(x - (x % PX), cy - py - PX, PX, PX);
    }
    ctx.fillStyle = COLORS.primary;
    ctx.fillRect(x - (x % PX), y - PX, PX, PX);
  }

  /* нижняя зеркальная — ФИОЛЕТОВЫЙ ГРАДИЕНТ по вертикали */
  const maxDepth = Math.round(amplitude * 0.7);
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const edge = Math.sin(t * Math.PI);
    const yOff = Math.round(wave[i] * amplitude * 0.7 * edge);
    const x = Math.floor(cx - halfW + t * width);
    const dist = Math.abs(yOff);
    for (let py = 0; py < dist; py += PX) {
      const alpha = 1 - py / (amplitude + 1);
      /* прогресс по глубине: 0 = у центра, 1 = максимальная глубина */
      const depth = dist > 0 ? py / dist : 0;
      /* интерполируем цвет между светлым и глубоким фиолетовым */
      const c1 = hexToRgb(COLORS.accentTop);
      const c2 = hexToRgb(COLORS.accentBottom);
      const rr = Math.round(c1[0] + (c2[0] - c1[0]) * depth);
      const gg = Math.round(c1[1] + (c2[1] - c1[1]) * depth);
      const bb = Math.round(c1[2] + (c2[2] - c1[2]) * depth);
      const a = 0.12 + alpha * 0.55;
      ctx.fillStyle = `rgba(${rr},${gg},${bb},${a})`;
      ctx.fillRect(x - (x % PX), cy + py + PX, PX, PX);
    }
  }

  /* свечение для нижней волны — фиолетовое */
  ctx.shadowColor = COLORS.glowPurple;
  /* перерисовываем только кончики с glow (опционально, для акцента) */
  ctx.shadowBlur = 6;
  for (let i = 0; i < N; i += 4) {
    const t = i / (N - 1);
    const edge = Math.sin(t * Math.PI);
    const yOff = Math.round(wave[i] * amplitude * 0.7 * edge);
    const x = Math.floor(cx - halfW + t * width);
    const dist = Math.abs(yOff);
    if (dist > 4) {
      ctx.fillStyle = rgbaStr(COLORS.accentBottom, 0.9);
      ctx.fillRect(x - (x % PX), cy + dist, PX, PX);
    }
  }
  ctx.shadowBlur = 0;

  /* тики */
  ctx.fillStyle = 'rgba(138,92,138,0.6)';
  const ticks = 24;
  for (let i = 0; i <= ticks; i++) {
    const x = Math.floor(cx - halfW + (i / ticks) * width);
    const isMajor = i % 4 === 0;
    const len = isMajor ? 4 : 2;
    ctx.fillRect(x - (x % PX), cy - len, PX, len * 2);
  }

  /* маркеры краёв — розовый слева, фиолетовый справа */
  ctx.fillStyle = COLORS.glowPink;
  ctx.fillRect(cx - halfW - 4, cy - 2, 2, 4);
  ctx.fillStyle = COLORS.glowPurple;
  ctx.fillRect(cx + halfW + 2, cy - 2, 2, 4);
}

draw();
</script>
</body>
</html>
