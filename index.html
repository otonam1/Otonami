<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otonami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0d0d;
    --bg-2: #141414;
    --fg: #e8e6e3;
    --fg-dim: #6b6b6b;
    --fg-mid: #a0a0a0;
    --accent: #c8b48a;
    --line: #2a2a2a;
    --line-bright: #3a3a3a;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* CRT-развёртка — как в плеере */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.008) 0px, rgba(255,255,255,0.008) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 9999;
  }

  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ─── верхний статус-бар ─── */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-dim);
    border-bottom: 1px solid var(--line);
    background: rgba(13,13,13,0.85);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  .topbar .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    margin-right: 8px;
    vertical-align: middle;
    animation: dotPulse 2.4s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent); }
    50%      { opacity: 0.5; box-shadow: 0 0 2px var(--accent); }
  }
  .topbar-left, .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar .sep { color: var(--line-bright); }

  /* ─── центр ─── */
  .hero {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    padding: 40px 24px;
    pointer-events: none;
  }

  .hero-meta {
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 0.2s;
  }
  .hero-meta .br {
    color: var(--line-bright);
    margin: 0 8px;
  }

  .hero-title {
    font-size: clamp(48px, 12vw, 140px);
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 0.95;
    color: var(--fg);
    text-align: center;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeIn 1s ease forwards 0.4s;
    position: relative;
  }
  .hero-title .accent {
    color: var(--accent);
    font-weight: 400;
  }

  /* мерцающий курсор после названия */
  .hero-title::after {
    content: '_';
    color: var(--accent);
    font-weight: 300;
    animation: cursorBlink 1.1s step-end infinite;
    margin-left: 4px;
  }
  @keyframes cursorBlink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  .hero-sub {
    font-size: clamp(10px, 1.2vw, 13px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--fg-dim);
    text-align: center;
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeIn 1s ease forwards 0.7s;
    max-width: 90vw;
    line-height: 1.8;
  }

  /* ─── кнопка СЛУШАТЬ ─── */
  .listen-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 18px 42px;
    background: transparent;
    border: 1px solid var(--line-bright);
    color: var(--fg);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    pointer-events: auto;
    overflow: hidden;
    transition: color 0.25s, border-color 0.25s;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1s;
  }
  .listen-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: translateX(-101%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: -1;
  }
  .listen-btn:hover {
    color: var(--bg);
    border-color: var(--accent);
  }
  .listen-btn:hover::before {
    transform: translateX(0);
  }
  .listen-btn .arrow {
    display: inline-block;
    transition: transform 0.25s;
    font-size: 16px;
  }
  .listen-btn:hover .arrow {
    transform: translateX(6px);
  }

  /* ─── нижняя подсказка ─── */
  .hero-footer {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--line-bright);
    z-index: 5;
    display: flex;
    gap: 20px;
    align-items: center;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1.3s;
    pointer-events: none;
  }
  .hero-footer .sep {
    color: var(--line);
  }

  /* угловые маркеры — как в кадре видоискателя */
  .corner {
    position: fixed;
    width: 20px;
    height: 20px;
    border-color: var(--line-bright);
    border-style: solid;
    border-width: 0;
    z-index: 3;
    pointer-events: none;
  }
  .corner.tl { top: 46px; left: 18px;  border-top-width: 1px;    border-left-width: 1px;  }
  .corner.tr { top: 46px; right: 18px; border-top-width: 1px;    border-right-width: 1px; }
  .corner.bl { bottom: 46px; left: 18px;  border-bottom-width: 1px; border-left-width: 1px;  }
  .corner.br { bottom: 46px; right: 18px; border-bottom-width: 1px; border-right-width: 1px; }

  /* горизонтальная линия-разделитель под названием */
  .hero-divider {
    width: 60px;
    height: 1px;
    background: var(--line-bright);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeIn 1s ease forwards 0.8s;
    position: relative;
  }
  .hero-divider::before,
  .hero-divider::after {
    content: '';
    position: absolute;
    top: -2px;
    width: 5px;
    height: 5px;
    background: var(--accent);
    border-radius: 50%;
  }
  .hero-divider::before { left: -3px; }
  .hero-divider::after  { right: -3px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .hero-title { font-size: clamp(40px, 16vw, 80px); }
    .hero-meta { letter-spacing: 0.25em; font-size: 9px; }
    .hero-sub { letter-spacing: 0.2em; font-size: 10px; }
    .listen-btn { padding: 16px 30px; font-size: 12px; letter-spacing: 0.2em; }
    .hero-footer { font-size: 9px; gap: 12px; letter-spacing: 0.15em; }
    .corner { display: none; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- статус-бар -->
<div class="topbar">
  <div class="topbar-left">
    <span><span class="dot"></span>Otonami</span>
    <span class="sep">/</span>
    <span>v1.0</span>
  </div>
  <div class="topbar-right">
    <span id="clock">00:00:00</span>
  </div>
</div>

<!-- угловые маркеры -->
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- центральный hero -->
<div class="hero">
  <div class="hero-meta">
    локальный плеер<span class="br">/</span>без облака<span class="br">/</span>без регистрации
  </div>

  <h1 class="hero-title">Oto<span class="accent">nami</span></h1>

  <div class="hero-divider"></div>

  <div class="hero-sub">
    музыка, которая живёт в вашем браузере<br>
    плейлисты · визуализация · умный шаффл
  </div>

  <a href="player.html" class="listen-btn">
    слушать
    <span class="arrow">→</span>
  </a>
</div>

<!-- подсказка снизу -->
<div class="hero-footer">
  <span>omarchy · edition</span>
  <span class="sep">/</span>
  <span>local-first</span>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   ЧАСЫ (как в плеере)
   ═══════════════════════════════════════════════════════ */
const clockEl = document.getElementById('clock');
function updateClock() {
  const d = new Date();
  clockEl.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, '0')).join(':');
}
updateClock();
setInterval(updateClock, 1000);

/* ═══════════════════════════════════════════════════════
   ФОНОВАЯ ПИКСЕЛЬНАЯ ВОЛНА
   Та же палитра и та же техника рендера, что в плеере,
   но без реального аудио — генерируем «дыхание» синусом
   ═══════════════════════════════════════════════════════ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const COLORS = {
  primary: '#e8e6e3',
  accent:  '#c8b48a'
};

function hexToRgb(hex) {
  hex = hex.replace('#', '');
  return [
    parseInt(hex.slice(0, 2), 16),
    parseInt(hex.slice(2, 4), 16),
    parseInt(hex.slice(4, 6), 16)
  ];
}
function rgbaStr(hex, alpha) {
  const [r, g, b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

function resize() {
  const scale = window.devicePixelRatio > 1 ? 2 : 1.5;
  canvas.width  = Math.floor(window.innerWidth / scale);
  canvas.height = Math.floor(window.innerHeight / scale);
  canvas.style.width  = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

// состояние «дыхания»
let phase = 0;
const N = 180;
let wave = new Float32Array(N);

function draw() {
  requestAnimationFrame(draw);

  const W = canvas.width;
  const H = canvas.height;
  const cx = Math.floor(W / 2);
  const cy = Math.floor(H / 2);

  // фон
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, W, H);

  // центральная пунктирная направляющая
  ctx.fillStyle = '#1a1a1a';
  for (let x = 0; x < W; x += 6) {
    ctx.fillRect(x, cy, 3, 1);
  }

  // генерируем волну — комбинация синусов разной частоты
  // чтобы было похоже на реальный осциллограф
  phase += 0.012;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    // основной тон + гармоники + лёгкий шум
    const s1 = Math.sin(t * 22 + phase * 1.0) * 0.5;
    const s2 = Math.sin(t * 41 - phase * 1.3) * 0.25;
    const s3 = Math.sin(t * 7  + phase * 0.6) * 0.4;
    const s4 = Math.sin(t * 63 + phase * 2.0) * 0.12;
    wave[i] = s1 + s2 + s3 + s4;
  }

  const amplitude = 28;
  const width = Math.min(W * 0.7, 340);
  const halfW = Math.floor(width / 2);
  const PX = 2;

  // верхняя волна — primary
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const edge = Math.sin(t * Math.PI);
    const yOff = Math.round(wave[i] * amplitude * edge);
    const x = Math.floor(cx - halfW + t * width);
    const y = cy - Math.abs(yOff);
    const dist = Math.abs(yOff);
    for (let py = 0; py < dist; py += PX) {
      const alpha = 1 - py / (amplitude + 1);
      ctx.fillStyle = rgbaStr(COLORS.primary, 0.15 + alpha * 0.85);
      ctx.fillRect(x - (x % PX), cy - py - PX, PX, PX);
    }
    ctx.fillStyle = COLORS.primary;
    ctx.fillRect(x - (x % PX), y - PX, PX, PX);
  }

  // нижняя зеркальная — accent
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const edge = Math.sin(t * Math.PI);
    const yOff = Math.round(wave[i] * amplitude * 0.7 * edge);
    const x = Math.floor(cx - halfW + t * width);
    const dist = Math.abs(yOff);
    for (let py = 0; py < dist; py += PX) {
      const alpha = 1 - py / (amplitude + 1);
      ctx.fillStyle = rgbaStr(COLORS.accent, 0.1 + alpha * 0.4);
      ctx.fillRect(x - (x % PX), cy + py + PX, PX, PX);
    }
  }

  // тики
  ctx.fillStyle = 'rgba(107,107,107,0.6)';
  const ticks = 24;
  for (let i = 0; i <= ticks; i++) {
    const x = Math.floor(cx - halfW + (i / ticks) * width);
    const isMajor = i % 4 === 0;
    const len = isMajor ? 4 : 2;
    ctx.fillRect(x - (x % PX), cy - len, PX, len * 2);
  }

  // маркеры краёв — accent
  ctx.fillStyle = COLORS.accent;
  ctx.fillRect(cx - halfW - 4, cy - 2, 2, 4);
  ctx.fillRect(cx + halfW + 2, cy - 2, 2, 4);
}

draw();
</script>
</body>
</html>
